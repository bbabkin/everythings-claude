<title>Everythings Panel</title>
<style>
  /* ------------------------------------------------------------------ tokens.
     Mirrors apps/web globals.css: neutral shadcn grays, one strong green.
     Tile shadow/hilite gradients follow thingIcon.module.css per theme. */
  :root {
    --bg: hsl(0 0% 100%);
    --fg: hsl(0 0% 6%);
    --card: hsl(0 0% 98.5%);
    --card-hover: hsl(0 0% 96%);
    --border: hsl(0 0% 89%);
    --muted: hsl(0 0% 42%);
    --brand: hsl(142 72% 29%);
    --brand-soft: hsl(142 45% 94%);
    --warn: hsl(43 90% 34%);
    --warn-soft: hsl(43 90% 94%);
    --danger: hsl(0 72% 45%);
    --danger-soft: hsl(0 80% 96%);
    --link: hsl(220 100% 30%);
    --code-bg: hsl(0 0% 94%);
    --radius: 10px;
    --tile-shadow-image: radial-gradient(rgba(0, 0, 0, 0.2) 0%, transparent 60%);
    --tile-hilite-hover: 0.5;
    --logo-shadow: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.18));
    --panel-veil: hsl(0 0% 100% / 0.3);
    --panel-top: hsl(0 0% 89%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: hsl(0 0% 4%);
      --fg: hsl(0 0% 96%);
      --card: hsl(0 0% 8%);
      --card-hover: hsl(0 0% 12%);
      --border: hsl(0 0% 16%);
      --muted: hsl(0 0% 64%);
      --brand: hsl(142 71% 45%);
      --brand-soft: hsl(142 40% 14%);
      --warn: hsl(43 85% 60%);
      --warn-soft: hsl(43 60% 14%);
      --danger: hsl(0 84% 64%);
      --danger-soft: hsl(0 45% 14%);
      --link: hsl(220 100% 80%);
      --code-bg: hsl(0 0% 13%);
      --tile-shadow-image: radial-gradient(rgba(255, 255, 255, 0.3) 0%, transparent 40%);
      --tile-hilite-hover: 0;
      --logo-shadow: none;
      --panel-veil: hsl(0 0% 0% / 0.3);
      --panel-top: hsl(0 0% 100% / 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: hsl(0 0% 4%);
    --fg: hsl(0 0% 96%);
    --card: hsl(0 0% 8%);
    --card-hover: hsl(0 0% 12%);
    --border: hsl(0 0% 16%);
    --muted: hsl(0 0% 64%);
    --brand: hsl(142 71% 45%);
    --brand-soft: hsl(142 40% 14%);
    --warn: hsl(43 85% 60%);
    --warn-soft: hsl(43 60% 14%);
    --danger: hsl(0 84% 64%);
    --danger-soft: hsl(0 45% 14%);
    --link: hsl(220 100% 80%);
    --code-bg: hsl(0 0% 13%);
    --tile-shadow-image: radial-gradient(rgba(255, 255, 255, 0.3) 0%, transparent 40%);
    --tile-hilite-hover: 0;
    --logo-shadow: none;
    --panel-veil: hsl(0 0% 0% / 0.3);
    --panel-top: hsl(0 0% 100% / 0.3);
  }
  :root[data-theme="light"] {
    --bg: hsl(0 0% 100%);
    --fg: hsl(0 0% 6%);
    --card: hsl(0 0% 98.5%);
    --card-hover: hsl(0 0% 96%);
    --border: hsl(0 0% 89%);
    --muted: hsl(0 0% 42%);
    --brand: hsl(142 72% 29%);
    --brand-soft: hsl(142 45% 94%);
    --warn: hsl(43 90% 34%);
    --warn-soft: hsl(43 90% 94%);
    --danger: hsl(0 72% 45%);
    --danger-soft: hsl(0 80% 96%);
    --link: hsl(220 100% 30%);
    --code-bg: hsl(0 0% 94%);
    --tile-shadow-image: radial-gradient(rgba(0, 0, 0, 0.2) 0%, transparent 60%);
    --tile-hilite-hover: 0.5;
    --logo-shadow: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.18));
    --panel-veil: hsl(0 0% 100% / 0.3);
    --panel-top: hsl(0 0% 89%);
  }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Montserrat', Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  * { box-sizing: border-box; }
  a { color: var(--link); }
  b, strong { font-weight: 600; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  #app { max-width: 1080px; margin: 0 auto; padding: 0 16px 40px; }

  /* ------------------------------------------------- workspace wallpaper.
     The workspace's own background, mirroring apps/web workspaceBackground:
     the light or dark image for the active theme, arranged cover | bottom |
     tiled, and the app's white→#ddd wash in light mode for a workspace with
     no wallpaper. It rides behind everything (fixed, negative z-index, above
     the body canvas); the sticky header is transparent, so it shows through
     the bar too. */
  #wallpaper { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

  /* --------------------------------------------------- header: no bar.
     Workspace picker left, logo badge center, refresh + status right.
     Transparent on the workspace grid, where the wallpaper should run edge to
     edge. Over an open thing it takes the same veil as the pane below it, so
     the card scrolling under it passes behind glass rather than into nothing;
     full-bleed there, hence the negative margin against #app's padding. */
  header.bar {
    position: sticky; top: 0; z-index: 10;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 10px;
    padding: 6px 0;
    background: transparent;
  }
  html.thing-open header.bar {
    margin: 0 -16px;
    padding-left: 16px; padding-right: 16px;
    background: var(--panel-veil);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
  }
  .bar .left { justify-self: start; min-width: 0; }
  .bar .right { justify-self: end; display: flex; align-items: center; gap: 8px; }
  .logo { display: block; width: 24px; height: 24px; filter: var(--logo-shadow); }

  /* Workspace picker. A native select sizes itself to its widest option, which
     stranded the chevron a workspace-name away from the name on show. So the
     select is laid invisibly over a label that is only as wide as the current
     name, and the chevron sits against it. The native dropdown still opens,
     and focus lands on the real control. */
  .wspick {
    position: relative;
    display: inline-flex; align-items: center; gap: 2px;
    max-width: 100%; padding: 3px 4px;
    border-radius: 8px;
  }
  .wspick:hover { background: var(--card-hover); }
  .wspick:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }
  .wspick .name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--fg); font-weight: 600; font-size: 14px;
  }
  .wspick .chev { flex-shrink: 0; width: 14px; height: 14px; color: var(--muted); }
  .wspick select {
    position: absolute; inset: 0;
    width: 100%; height: 100%; margin: 0; padding: 0;
    border: none; opacity: 0; cursor: pointer;
    font: inherit;
  }

  button.iconbtn {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: none; border-radius: 8px;
    background: transparent; cursor: pointer;
  }
  button.iconbtn:hover { background: var(--card-hover); }
  button.iconbtn svg { width: 15px; height: 15px; }
  button.iconbtn.on { color: var(--brand); background: var(--brand-soft); }
  button.iconbtn.on svg { animation: dotpulse 1.4s ease-in-out infinite; }
  button.iconbtn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .status.stale .dot { background: var(--warn); }
  .status.err .dot { background: var(--danger); }
  .status .dot.pulse { animation: dotpulse 1.4s ease-in-out infinite; }
  @keyframes dotpulse { 50% { opacity: 0.35; } }
  @media (max-width: 560px) { .status .ago { display: none; } }

  /* ------------------------------------------------------------------ banner */
  .banner {
    margin: 12px 0 0;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--danger-soft);
  }
  .banner.warn { background: var(--warn-soft); }
  .banner b { display: block; margin-bottom: 2px; }
  .banner .body { color: var(--muted); font-size: 13px; }

  /* ------------------------------------------------------ tiles ("things").
     Ported from thingIcon.module.css: no card, no border — a floating emoji
     with a radial shadow blob and lift on hover. */
  .grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    margin-top: 14px;
  }
  .thing {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    min-width: 80px; min-height: 88px;
    padding: 14px 8px 10px;
    border: none; border-radius: 12px;
    background: none;
    cursor: pointer; text-align: center;
    transition: all 0.3s;
  }
  .thingEmoji {
    position: relative; z-index: 2;
    font-size: 2rem; line-height: 1.15;
    white-space: nowrap; pointer-events: none;
    transition: all 0.3s linear;
  }
  /* Multi-emoji icon: the first glyph sizes the box, the rest overlay it and
     are nudged bottom-right by inline transforms (see emojiHtml). */
  .stack { position: relative; display: inline-block; line-height: 1; }
  .stack i { position: absolute; inset: 0; font-style: normal; line-height: 1; }
  .thingName {
    position: relative; z-index: 2;
    display: flex; justify-content: center;
    margin-top: 6px;
    font-size: 13px; font-weight: 500;
    pointer-events: none;
    hyphens: auto; overflow-wrap: anywhere; text-align: center;
    transition: all 0.3s linear;
  }
  .thingShadow {
    pointer-events: none;
    position: absolute;
    top: 34px; left: 50%;
    width: 80px; height: 40px;
    opacity: 0;
    background-image: var(--tile-shadow-image);
    transition: all 0.3s;
    transform: scale(1.2) translateY(-5px) translateX(-50%);
    z-index: 1;
  }
  .thingHilite {
    pointer-events: none;
    position: absolute;
    top: 4px; left: 50%; margin-left: -40px;
    width: 80px; height: 60px;
    opacity: 0;
    background: radial-gradient(rgba(255, 255, 255, 0.5) 0%, transparent 70%);
    transition: all 0.3s;
    transform: scale(1) translateY(5px);
    z-index: 3;
  }
  .thing:hover .thingEmoji, .thing:focus .thingEmoji { transform: scale(1.3) translateY(-5px); }
  .thing:hover .thingShadow, .thing:focus .thingShadow {
    opacity: 0.8;
    transform: scale(1.2) translateY(5px) translateX(-50%);
  }
  .thing:hover .thingHilite, .thing:focus .thingHilite {
    opacity: var(--tile-hilite-hover);
    transform: scale(1) translateY(-15px);
  }
  .thing.flash-new { animation: flashNew 2.6s ease-out; }
  .thing.flash-changed { animation: flashChanged 2.6s ease-out; }
  @keyframes flashNew {
    0% { box-shadow: 0 0 0 3px var(--brand); background: var(--brand-soft); }
    70% { box-shadow: 0 0 0 3px transparent; }
    100% { background: none; }
  }
  @keyframes flashChanged {
    0% { box-shadow: 0 0 0 3px var(--warn); background: var(--warn-soft); }
    70% { box-shadow: 0 0 0 3px transparent; }
    100% { background: none; }
  }
  .skel { pointer-events: none; }
  .skel .thingEmoji { width: 34px; height: 34px; background: var(--card-hover); border-radius: 50%; animation: dotpulse 1.4s ease-in-out infinite; }
  .skel .thingName { width: 56px; height: 12px; background: var(--card-hover); border-radius: 6px; animation: dotpulse 1.4s ease-in-out infinite; }

  .openws { text-align: center; margin: 44px 0 24px; }
  .openws a { color: var(--muted); font-size: 12.5px; text-decoration: none; }
  .openws a:hover { color: var(--fg); text-decoration: underline; }

  .empty { color: var(--muted); font-style: italic; padding: 14px 2px; text-align: center; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; text-align: center; }

  /* ------------------------------------------------------------------ detail.
     An opened thing sits on its own pane: a white or black veil over a blurred
     backdrop, so the workspace wallpaper reads as texture behind the text
     instead of competing with it.
     The veil is light (0.3) so the wallpaper reads through it. How much that
     shows is the wallpaper's to decide, not this rule's: measured behind the
     pane, the dark preset "abstract" spans 55 levels of luminance and comes
     through plainly, while the light preset "fog" is flat white there (mean
     252/255, spread 6), so no alpha reveals anything.
     The 4px top edge is the app's, which caps a thing card the same way; the
     app tints it with the thing's own colour, a field the read tools here do
     not carry, so it takes the app's uncoloured fallback per theme. */
  .thing-card {
    margin-top: 6px;
    padding: 14px 18px 20px;
    border-top: 4px solid var(--panel-top);
    border-radius: var(--radius);
    background: var(--panel-veil);
    box-shadow: 0 6px 24px hsl(0 0% 0% / 0.12);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
  }
  .thing-card > .thing-head { margin-top: 0; }

  .sect-label {
    margin: 22px 0 4px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted);
  }
  .sect-label .cnt { font-weight: 400; letter-spacing: normal; text-transform: none; font-variant-numeric: tabular-nums; }
  /* The pane's header is one inline line, the way the app's thing card reads:
     each ancestor with its emoji in muted type, a chevron between, then this
     thing in full weight with its own. The workspace is not part of it, the
     header's picker names it already. */
  .thing-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0; }
  .crumbs {
    display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
    flex: 1; min-width: 0; margin: 0;
    font-size: 14px; color: var(--muted);
  }
  /* Ancestors sit in the same flex line as the current thing, not a box of
     their own, so the gap and wrapping stay uniform across the whole row. */
  #crumbTrail { display: contents; }
  .crumbs button {
    display: inline-flex; align-items: center; gap: 4px;
    border: none; background: none; padding: 0; cursor: pointer;
    color: var(--muted); font-size: 14px;
  }
  .crumbs button:hover { color: var(--fg); text-decoration: underline; }
  .crumbs .ce { font-size: 17px; line-height: 1; }
  .crumbs .sep { user-select: none; }
  .crumb-current {
    display: inline-flex; align-items: center; gap: 6px; min-width: 0;
    margin: 0; font-size: 15px; font-weight: 600; color: var(--fg);
  }
  .crumb-current .e { font-size: 21px; line-height: 1; }
  /* Its own line under the header, left aligned: a secondary action that has
     no business competing with the title for the top row. */
  .openapp {
    display: inline-block; margin: 3px 0 14px;
    font-size: 11px; white-space: nowrap; color: var(--muted);
  }
  .openapp:hover { color: var(--fg); }
  /* Close: the app's own control, a 27px filled circle-X (Heroicons solid)
     that is muted until hover, pinned to the top right of the pane. A real
     button here, since the app renders a bare click-handling SVG that keyboard
     users cannot reach. */
  .thing-head .closebtn {
    margin-left: auto; align-self: center; flex-shrink: 0;
    width: 27px; height: 27px; padding: 0;
    border: none; border-radius: 50%;
    background: none; color: var(--muted);
    cursor: pointer; transition: color 0.2s;
  }
  .thing-head .closebtn:hover { color: var(--brand); }
  .thing-head .closebtn svg { display: block; width: 27px; height: 27px; }

  /* In the header line, pushed to the right by the crumbs' flex:1 and ending
     just short of the close button. Wraps under the title when a long name and
     a crowd of marks cannot share one line. */
  .marks-row {
    display: flex; flex-wrap: wrap; justify-content: flex-end;
    gap: 6px; margin: 0; flex-shrink: 0;
  }
  .mark-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--card-hover); font-size: 13px;
  }
  .mark-chip .c { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .mark-chip.mine { background: var(--brand-soft); }

  .comment { padding: 8px 0; }
  .comment.reply { margin-left: 22px; }
  .comment .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .comment .meta b { color: var(--fg); }

  /* ------------------------------------------------------------------ prose */
  .prose { max-width: 68ch; overflow-wrap: anywhere; margin-top: 8px; }
  .prose h1 { font-size: 18px; font-weight: 600; margin: 14px 0 6px; }
  .prose h2 { font-size: 16px; font-weight: 600; margin: 13px 0 5px; }
  .prose h3, .prose h4, .prose h5, .prose h6 { font-size: 14.5px; font-weight: 600; margin: 12px 0 4px; }
  .prose p { margin: 7px 0; }
  .prose ul, .prose ol { margin: 7px 0; padding-left: 24px; }
  .prose li { margin: 2px 0; }
  .prose li.task { list-style: none; margin-left: -18px; }
  .prose li.task input { margin-right: 6px; accent-color: var(--brand); }
  .prose code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; font-family: Consolas, Menlo, monospace; }
  .prose pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .prose pre code { background: none; padding: 0; }
  .prose blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .prose hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .prose .tablewrap { overflow-x: auto; }
  .prose table { border-collapse: collapse; margin: 8px 0; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 4px 9px; text-align: left; }
  .prose th { background: var(--card); font-weight: 600; }
  .prose .align-center { text-align: center; }
  .prose .align-right { text-align: right; }
  .prose .imgchip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; margin: 2px 0;
    border-radius: 999px;
    background: var(--card-hover); font-size: 12px;
    color: var(--muted); text-decoration: none;
  }
  .prose .imgchip:hover { color: var(--fg); }

  /* ------------------------------------------------------------------ misc */
  #toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .toast {
    padding: 8px 12px; max-width: 280px;
    border-radius: 8px;
    background: var(--card); box-shadow: 0 4px 14px hsl(0 0% 0% / 0.15);
    font-size: 13px;
  }
  .secterr { color: var(--danger); font-size: 13px; padding: 6px 0; }

  @media (prefers-reduced-motion: reduce) {
    .thing, .thingEmoji, .thingName, .thingShadow, .thingHilite { transition: none; }
    .thing.flash-new, .thing.flash-changed, .iconbtn.spin svg, .iconbtn.on svg,
    .status .dot.pulse, .skel .thingEmoji, .skel .thingName { animation: none; }
  }
</style>

<div id="wallpaper"></div>
<div id="app">
  <header class="bar">
    <div class="left">
      <span class="wspick">
        <span class="name" id="wsName">Loading…</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        <select id="wsSelect" aria-label="Workspace"><option>Loading…</option></select>

  const SERVER = 'Everythings';
  const APP_URL = 'https://everythings.app';
  // Polling is this page's entire running cost, and it is paid by the app's
  // own hosting: every tick of every watch is a request, from every panel
  // anyone has left open, whether or not a human is looking. So NOTHING polls
  // unless follow mode is armed. With follow off the panel is a snapshot that
  // refreshes when the viewer navigates (registering a watch executes it) and
  // when they press refresh (invalidate makes registered watches re-execute)
  // — everything a reader needs, at no standing cost. Never give a watch a
  // refetchInterval outside the follow path.
  //
  // Declared cadence for the live surfaces while following. The runtime
  // clamps refetchInterval to a ~30 s floor today, so this asks for the
  // fastest cadence allowed and picks up anything faster for free if the
  // floor ever drops. Sub-floor freshness comes from invalidateThing() below
  // — change-triggered, never a timer.
  const POLL_FAST = 15000;
  // Following is not a mode anyone remembers to switch off, so it switches
  // itself off after this long with nothing written. That is what stops a
  // panel left open overnight from polling until morning. Only a real change
  // restarts the clock: a poll that reports nothing new IS the inactivity
  // being measured.
  //
  // Fifteen minutes rather than five: the saving comes from the hours a panel
  // sits open doing nothing, not from the length of this window (5 min costs
  // ~20 reads per quiet stretch, 15 costs ~60, against ~6.5k a day for never
  // stopping). Buying two thirds of that back to survive a slow build or a
  // long tool run without stranding the viewer is worth it — an agent that
  // pauses six minutes and resumes is ordinary, and a panel that stopped
  // listening for it has failed at its one job.
  const FOLLOW_IDLE = 900000;
  // Long-lived cache: watchTool replays the stored entry instantly on
  // (re)registration and still refreshes once it is past staleTime, so a
  // day-long gcTime makes reopening the panel paint from last-good data at
  // once instead of a skeleton. A staleTime above the poll cadence keeps
  // grid<->thing navigation, and the re-registration a follow flip causes,
  // from re-executing reads that were just refreshed.
  const CACHE = { staleTime: 60000, gcTime: 86400000 };

  // (same day-long gcTime) but never serve it without refreshing. staleTime 0
  // matters only then — a thing whose text an agent is filling in must not be
  // answered from a copy taken seconds ago. Idle, the live surfaces fall back

  const LIVE_CACHE = { staleTime: 0, gcTime: 86400000 };

  const LIVE_OPTS = { live: true };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* sandboxed */ } },
  };

  // Ported from components/thing/stackedEmoji.tsx: an icon holding several
  // emojis draws the first three layered, each nudged toward the bottom-right
  // of the one beneath it. Sized in em, so it follows the inherited font-size.
  const MAX_STACKED = 3;
  const STACK_STEP_EM = 0.22;
  const segmenter = (typeof Intl !== 'undefined' && 'Segmenter' in Intl)
    ? new Intl.Segmenter(undefined, { granularity: 'grapheme' })
    : null;

  // modifiers each count as one emoji rather than several code points.
  function graphemes(value) {
    const parts = segmenter
      ? Array.from(segmenter.segment(value), (s) => s.segment)
      : Array.from(value);
    return parts.filter((g) => g.trim() !== '');

    const glyphs = graphemes(raw).slice(0, MAX_STACKED);
    if (glyphs.length <= 1) return esc(glyphs[0] ?? raw);

      const off = (i * STACK_STEP_EM).toFixed(2) + 'em';

    }
    return h + '</span>';

  // <<< wallpaper presets

  const remoteWp = new Map(); // absolute URL -> 'pending' | 'ok' | 'no'
  const HEX = /^#[0-9a-f]{6}$/i;

  function presetKey(url) {
    const m = /\/images\/wallpapers\/([a-z]+)\/([^/?#]+)\.[a-z0-9]+(?:[?#]|$)/i.exec(url || '');
    return m ? (m[1] + '/' + m[2]).toLowerCase() : null;
  }
  // Only ever hand url() a scheme we chose, with the quote/paren/newline
  // characters that could break out of the declaration encoded.
  function cssUrl(src) {
    if (!/^(https?:|data:image\/)/i.test(src)) return null;
    return 'url("' + src.replace(/["'()\\\s]/g, encodeURIComponent) + '")';
  }
  function isDarkTheme() {
    const forced = document.documentElement.getAttribute('data-theme');
    if (forced === 'dark' || forced === 'light') return forced === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function tryRemoteWp(url) {
    if (remoteWp.has(url)) return;
    remoteWp.set(url, 'pending');
    const img = new Image();
    img.onload = () => { remoteWp.set(url, 'ok'); renderWallpaper(); };
    // Refused by the CSP, or simply gone: the accent wash stands in.
    img.onerror = () => { remoteWp.set(url, 'no'); };
    img.src = url;
  }

  function renderWallpaper() {
    const el = $('wallpaper');
    if (!el) return;
    const c = state.chrome;
    const dark = isDarkTheme();
    // Per theme, exactly as apps/web does it: a workspace with only a light
    // wallpaper shows none in dark mode rather than a mismatched image.
    const url = (c && (dark ? c.darkBgUrl : c.bgUrl)) || null;
    const accent = (c && (dark ? c.darkColor : c.color)) || null;
    const key = presetKey(url);
    const src = (key && WALLPAPERS[key]) || (url && remoteWp.get(url) === 'ok' ? url : null);
    if (url && !src) tryRemoteWp(url);

    const s = el.style;
    s.backgroundImage = s.backgroundSize = s.backgroundPosition = s.backgroundRepeat = '';
    const image = src && cssUrl(src);
    if (image) {
      s.backgroundImage = image;
      switch (String((c && c.bgArrangement) || 'cover').toLowerCase()) {
        case 'bottom':
          s.backgroundSize = '100% auto'; s.backgroundPosition = 'center bottom'; s.backgroundRepeat = 'no-repeat';
          break;
        case 'tiled':
          s.backgroundSize = 'auto'; s.backgroundPosition = 'center'; s.backgroundRepeat = 'repeat';
          break;
        default:
          s.backgroundSize = 'cover'; s.backgroundPosition = 'center'; s.backgroundRepeat = 'no-repeat';
      }
    } else if (url && accent && HEX.test(accent)) {
      // Their wallpaper exists but can't be drawn here: tint the page with the
      // workspace's own accent so it still looks like that workspace.
      s.backgroundImage = 'linear-gradient(to bottom, ' + accent + '33, transparent 70%)';
    } else if (!dark) {
      // The app's own no-wallpaper light background.
      s.backgroundImage = 'linear-gradient(to bottom, #ffffff, #dddddd)';
    }
  }

  function setChrome(chrome) {
    if (!changed('chrome', chrome || null)) return;
    state.chrome = chrome || null;
    renderWallpaper();
  }

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', renderWallpaper);
    else if (mq.addListener) mq.addListener(renderWallpaper);
  }
  // claude.ai stamps data-theme on <html> when the viewer flips the theme.
  new MutationObserver(renderWallpaper)
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  renderWallpaper();

  const mcp = window.claude ? window.claude.mcp : undefined;

  // ---------------------------------------------------------------- errors
  const AUTHZ = new Set(['needs_reauth', 'server_not_connected', 'selection_required',
    'blocked_by_policy', 'approval_required', 'not_granted', 'capability_disabled', 'capability_removed']);
  const ERROR_COPY = {
    server_not_connected: ['Everythings isn’t connected', 'Add the Everythings connector in claude.ai Settings → Connectors, then reload this page.'],
    selection_required: ['Choose an Everythings connector', 'You have more than one connector named “Everythings”. Pick one when claude.ai asks, or reload the page to be asked again.'],
    needs_reauth: ['Reconnect Everythings', 'Your Everythings connection expired. Reconnect it in claude.ai Settings → Connectors, then reload.'],
    blocked_by_policy: ['Blocked by organization policy', 'Your organization blocks this connector tool for artifact pages.'],
    approval_required: ['Approval required', 'Your organization requires per-call approval for this tool, which artifact pages can’t provide yet.'],
    not_granted: ['Live data unavailable', 'This view didn’t receive connector access. Reopen the artifact from claude.ai.'],
    capability_disabled: ['Live data unavailable', 'Connector access isn’t usable in this view. Reopen the artifact from claude.ai.'],
    capability_removed: ['Live data unavailable', 'Connector access isn’t available in this runtime. Reopen the artifact from claude.ai.'],
  };

  function setStatus(kind, text) {
    const el = $('status');
    el.classList.toggle('stale', kind === 'stale');
    el.classList.toggle('err', kind === 'err');
    el.querySelector('.dot').classList.toggle('pulse', kind === 'boot' || kind === 'stale');
    if (text) $('statusAgo').textContent = text;
  }

  function showBanner(title, body, warn) {
    $('banner').innerHTML = '<div class="banner' + (warn ? ' warn' : '') + '"><b>' + esc(title) + '</b><div class="body">' + esc(body) + '</div></div>';
  }
  function clearBanner() { $('banner').innerHTML = ''; }

  function handleErr(section, err) {
    const code = err && err.code;
    if (AUTHZ.has(code)) {
      // Authorization denials retract rendered data: one connector feeds every
      // section, so this is a page-level condition.
      state.condition = 'authz';
      const copy = ERROR_COPY[code] || ['Everythings is unavailable', err.message || String(code)];
      $('view').innerHTML = '';
      showBanner(copy[0], copy[1], false);
      setStatus('err', 'not connected');
      return;
    }
    if (code === 'tool_error' || code === 'bad_request' || code === 'transform_error') {
      const slot = document.querySelector('[data-err="' + section + '"]');
      if (slot) {
        slot.innerHTML = '<div class="secterr">Couldn’t load this section: ' + esc(err.message || code) + '</div>';
        // A section hidden while empty (comments) must still surface its error.
        if (slot.parentElement && slot.parentElement.hidden) slot.parentElement.hidden = false;
      }
      return;
    }
    // Transient (server_unavailable, rate_limited, upstream_error, unknown):
    // keep last-good data; the ~30 s poll is the retry.
    if (state.condition !== 'authz') {
      state.condition = 'stale';
      setStatus('stale', 'connection hiccup — retrying');
    }
  }

  function markData(result) {
    state.lastDataAt = (result && result.cache && result.cache.storedAt) || Date.now();
    if (state.condition !== 'ok') {
      state.condition = 'ok';
      clearBanner();
    }
    setStatus('ok');
    renderAgo();
  }

  // ---------------------------------------------------------------- time
  function parseTs(s) {
    if (!s) return null;
    const t = Date.parse(/[zZ]$|[+\-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
    return Number.isNaN(t) ? null : t;
  }
  function fmtAgo(ms) {
    const d = Math.max(0, Date.now() - ms);
    if (d < 15e3) return 'just now';
    if (d < 60e3) return Math.round(d / 1e3) + 's ago';
    if (d < 36e5) return Math.round(d / 6e4) + 'm ago';
    if (d < 864e5) return Math.round(d / 36e5) + 'h ago';
    return Math.round(d / 864e5) + 'd ago';
  }
  function renderAgo() {
    if (state.condition === 'ok' && state.lastDataAt) $('statusAgo').textContent = 'updated ' + fmtAgo(state.lastDataAt);
  }
  setInterval(renderAgo, 10000);

  // ---------------------------------------------------------------- toasts
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }

  // ---------------------------------------------------------------- watches
  // A live watch (opts.live) reads a surface an agent can change under the
  // viewer — the open thing, the landing grid. Those are the only watches
  // that ever poll, and only while follow mode is armed; the mode flipping
  // re-registers them on the new cadence rather than tearing down the view,
  // since what changes is how often they refresh, not what is on screen.
  // Every other watch fetches once at registration and afterwards only when
  // something invalidates it.
  //
  // onErr (optional) sees the error first; returning true swallows it so a
  // caller can branch (e.g. fall back when a tool is missing) without the
  // page-level error handling kicking in.
  const liveWatches = new Set();
  function watch(tool, input, onData, section, opts, onErr) {
    const o = opts || {};
    const handler = (ev) => {
      if (ev.type === 'data') { markData(ev.result); onData(ev.result.payload, ev.result); }
      else if (!(onErr && onErr(ev.error))) handleErr(section, ev.error);
    };
    let un = null;
    const bind = () => {
      const options = {};
      if (o.live) {
        options.cache = state.follow ? LIVE_CACHE : CACHE;
        if (state.follow) options.refetchInterval = POLL_FAST;
      } else {
        options.cache = o.cache || CACHE;
        // Only the follow feed passes one, and only while it exists.
        if (o.refetchInterval) options.refetchInterval = o.refetchInterval;
      }
      un = mcp.watchTool(SERVER, tool, input, handler, options);
    };
    bind();
    const stop = () => {
      liveWatches.delete(stop);
      if (!un) return;
      const u = un;
      un = null; // unsubscribing twice is fine; re-binding a stopped watch is not
      try { u(); } catch { /* idempotent */ }
    };
    if (o.live) {
      stop.rebind = () => {
        if (!un) return;
        try { un(); } catch { /* idempotent */ }
        bind();
      };
      liveWatches.add(stop);
    }
    return stop;
  }
  function clearScoped() {
    for (const un of subs.scoped) { try { un(); } catch { /* idempotent */ } }
    subs.scoped = [];
    for (const k of ['grid', 'children', 'thing', 'marks', 'comments']) renderKeys.delete(k);
  }

  // Only an open thing dresses the header (see header.bar): the grid leaves it
  // fully transparent. Every assignment to state.view calls this.
  function syncViewChrome() {
    const open = !!(state.view && state.view.type === 'thing');
    document.documentElement.classList.toggle('thing-open', open);
  }

  // ---------------------------------------------------------------- tiles
  function tileEl(t, onClick) {
    const b = document.createElement('button');
    b.className = 'thing';
    b.innerHTML = '<span class="thingHilite"></span>' +
      '<span class="thingEmoji">' + emojiHtml(t.emoji || '\u{1F4C4}') + '</span>' +
      '<span class="thingName">' + esc(t.name) + '</span>' +
      '<span class="thingShadow"></span>';
    b.addEventListener('click', () => { userNav(); onClick(); });
    return b;
  }
  function skeletonGrid(n) {
    let h = '<div class="grid">';
    for (let i = 0; i < n; i++) h += '<div class="thing skel"><span class="thingEmoji"></span><span class="thingName"></span></div>';
    return h + '</div>';
  }

  function diffFlash(prev, things) {
    // Returns {flags: id -> 'new'|'changed', removed: [names]}
    const flags = {}; const removed = [];
    if (prev) {
      for (const t of things) {
        const p = prev.get(t.id);
        if (!p) flags[t.id] = 'new';
        else if (p.name !== t.name || p.emoji !== t.emoji) flags[t.id] = 'changed';
      }
      const ids = new Set(things.map((t) => t.id));
      for (const [id, p] of prev) if (!ids.has(id)) removed.push(p.name);
    }
    return { flags, removed };
  }

  // ---------------------------------------------------------------- grid view
  // Renders one list_things-shaped payload ({things, returned, count,
  // truncated}) into the grid slot; shared by the bootstrap and legacy paths.
  function renderGridThings(p) {
    const things = (p && p.things) || [];
    if (!changed('grid', things)) return;
    const { flags, removed } = diffFlash(state.gridPrev, things);
    state.gridPrev = new Map(things.map((t) => [t.id, { name: t.name, emoji: t.emoji }]));
    for (const name of removed) toast('Removed: ' + name);
    $('gridMeta').textContent = p.truncated ? 'Showing ' + p.returned + ' of ' + p.count : '';
    const slot = $('gridSlot');
    if (!things.length) { slot.innerHTML = '<div class="empty">No things here yet.</div>'; return; }
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const t of things) {
      const el = tileEl(t, () => openThing(t, []));
      if (flags[t.id]) el.classList.add('flash-' + flags[t.id]);
      grid.appendChild(el);
    }
    slot.innerHTML = '';
    slot.appendChild(grid);
  }

  function openGrid() {
    clearScoped();
    const view = { type: 'grid' };
    state.view = view;
    syncViewChrome();
    state.gridPrev = null;
    $('view').innerHTML =
      '<div id="gridSlot">' + skeletonGrid(8) + '</div><div data-err="grid"></div>' +
      '<div class="note" id="gridMeta"></div>' +
      '<div class="openws"><a id="openWs" href="' + esc(APP_URL + '/workspaces/' + (state.currentWs || '')) + '" target="_blank" rel="noopener">Open this workspace in the app ↗</a></div>';

    if (state.noBoot) {
      // Legacy two-call path for servers without the bootstrap tool. With no
      // workspace picked yet, the base list_workspaces watch lands and
      // reopens this view.
      if (!state.currentWs) return;
      subs.scoped.push(watch('list_things', { workspaceId: state.currentWs, limit: 200 }, (p) => {
        if (state.view !== view) return;
        renderGridThings(p);
      }, 'grid', LIVE_OPTS));
      return;
    }

    // One call for the whole landing view: workspaces + default + the landing
    // workspace's things. The server lands on the requested workspace while
    // it is accessible, else the default, else the first — a stale saved id
    // never errors, the payload just says where we actually landed.
    const input = { limit: 200 };
    if (state.currentWs) input.workspaceId = state.currentWs;
    subs.scoped.push(watch('bootstrap', input, (p) => {
      if (state.view !== view) return;
      if (p && p.landing && p.landing.workspaceId !== state.currentWs) {
        // The server redirected (nothing saved, or access lost): adopt.
        state.currentWs = p.landing.workspaceId;
        store.set('ews.ws', state.currentWs);
        const link = $('openWs');
        if (link) link.href = APP_URL + '/workspaces/' + state.currentWs;
      }
      // The landing workspace's wallpaper + accent, from the same delivery as
      // its things, so the look lands with the contents rather than after them.
      if (p && p.landing) setChrome(p.landing.chrome);
      handleWorkspaces(p);
      if (state.view !== view) return; // handleWorkspaces re-landed under us
      if (p && p.landing) renderGridThings(p.landing);
    }, 'grid', LIVE_OPTS, (err) => {
      // A server predating the tool, or a policy/consent layer blocking just
      // this one (a freshly added manifest tool can lag the viewer's grant):
      // fall back to the two-call path once. If policy blocks the connector
      // wholesale, the legacy calls fail the same way and the page-level
      // banner takes over from them.
      if (!state.noBoot && (err.code === 'tool_error' || err.code === 'not_in_manifest' ||
          err.code === 'blocked_by_policy' || err.code === 'approval_required' ||
          err.code === 'bad_request' || err.code === 'transform_error')) {
        state.noBoot = true;
        if (state.view === view) openGrid();
        return true;
      }
      return false;
    }));
  }

  // ---------------------------------------------------------------- detail view
  // An ancestor crumb carries its emoji the way the app's parent link does.
  function crumbBtn(item, onClick) {
    const b = document.createElement('button');
    b.innerHTML = (item.emoji ? '<span class="ce">' + emojiHtml(item.emoji) + '</span>' : '') +
      '<span>' + esc(item.name) + '</span>';
    b.addEventListener('click', () => { userNav(); onClick(); });
    return b;
  }

  function openThing(t, trail) {
    clearScoped();
    state.view = { type: 'thing', id: t.id, name: t.name, emoji: t.emoji, trail };
    syncViewChrome();
    state.childPrev = null;
    const v = $('view');
    v.innerHTML =
      '<div class="thing-card">' +
      '<div class="thing-head">' +
      '<div class="crumbs" id="crumbs"><span id="crumbTrail"></span>' +
      '<h1 class="crumb-current"><span class="e" id="dEmoji"></span><span id="dName"></span></h1></div>' +
      '<div class="marks-row" id="dMarks"></div>' +
      '<button class="closebtn" id="dClose" aria-label="Close" title="Close">' +
      '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" ' +
      'd="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Z' +
      'm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 ' +
      '1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z" clip-rule="evenodd"/></svg></button></div>' +
      '<div><a class="openapp" id="dOpen" target="_blank" rel="noopener">open in app ↗</a></div>' +
      '<div data-err="marks"></div>' +
      '<div class="prose" id="dContent"></div><div data-err="thing"></div>' +
      '<div id="dChildren">' + skeletonGrid(4) + '</div><div data-err="children"></div>' +
      '<div id="dCommentsSect" hidden><div class="sect-label">Comments <span class="cnt" id="dCommentCount"></span></div>' +
      '<div id="dComments"></div><div data-err="comments"></div></div>' +
      '</div>';

    // Every ancestor is followed by a chevron, because this thing always
    // closes the line. A top-level thing has none and the line is just itself.
    const trailEl = $('crumbTrail');
    for (const a of trail) {
      trailEl.appendChild(crumbBtn(a, () => openThing(a, trail.slice(0, trail.indexOf(a)))));
      trailEl.insertAdjacentHTML('beforeend', '<span class="sep">›</span>');
    }

    $('dEmoji').innerHTML = emojiHtml(t.emoji || '');
    $('dName').textContent = t.name;
    $('dOpen').href = APP_URL + '/workspaces/' + state.currentWs + '/things/' + t.id;

    // Closing goes up one level, matching the app: to the parent thing when
    // this one is nested, to the workspace grid when it is top level.
    $('dClose').addEventListener('click', () => {
      userNav();
      const up = trail[trail.length - 1];
      if (up) openThing(up, trail.slice(0, -1));
      else openGrid();
    });

    // Section renderers, shared by the one-call path and the legacy per-tool
    // watches below. Each takes exactly the payload its own tool returns, so
    // get_thing_view hands each one its matching section untouched.
    const renderThing = (p) => {
      if (!state.view || state.view.id !== t.id) return;
      if (!changed('thing', p)) return;
      $('dEmoji').innerHTML = emojiHtml(p.emoji || '');
      $('dName').textContent = p.name || t.name;
      state.view.name = p.name || t.name;
      $('dContent').innerHTML = p.content ? mdRender(p.content) : '';
    };

    const renderChildren = (p) => {
      if (!state.view || state.view.id !== t.id) return;
      const kids = (p && p.things) || [];
      if (!changed('children', kids)) return;
      const { flags, removed } = diffFlash(state.childPrev, kids);
      state.childPrev = new Map(kids.map((k) => [k.id, { name: k.name, emoji: k.emoji }]));
      for (const name of removed) toast('Removed: ' + name);
      const slot = $('dChildren');
      // The tiles speak for themselves: no heading, and nothing at all when a
      // thing has no sub-things (the Comments section hides the same way).
      if (!kids.length) { slot.innerHTML = ''; return; }
      const grid = document.createElement('div');
      grid.className = 'grid';
      const nextTrail = trail.concat([{ id: t.id, name: state.view.name, emoji: t.emoji }]);
      for (const k of kids) {
        const el = tileEl(k, () => openThing(k, nextTrail));
        if (flags[k.id]) el.classList.add('flash-' + flags[k.id]);
        grid.appendChild(el);
      }
      slot.innerHTML = '';
      slot.appendChild(grid);
    };

    const renderMarks = (p) => {
      if (!state.view || state.view.id !== t.id) return;
      const marks = (p && p.marks) || [];
      if (!changed('marks', marks)) return;
      const row = $('dMarks');
      row.innerHTML = '';
      for (const m of marks) {
        const chip = document.createElement('span');
        chip.className = 'mark-chip' + (m.mine ? ' mine' : '');
        chip.innerHTML = '<span>' + esc(m.emoji || m.name) + '</span><span class="c">' + Number(m.count) + '</span>';
        chip.title = (m.users || []).join(', ');
        row.appendChild(chip);
      }
    };

    const renderComments = (p) => {
      if (!state.view || state.view.id !== t.id) return;
      const all = (p && p.comments) || [];
      if (!changed('comments', all)) return;
      $('dCommentCount').textContent = p.count ? '— ' + p.count : '';
      const slot = $('dComments');
      $('dCommentsSect').hidden = !all.length;
      if (!all.length) { slot.innerHTML = ''; return; }
      slot.innerHTML = '';
      const roots = all.filter((c) => !c.parentId);
      const byParent = new Map();
      for (const c of all) {
        if (c.parentId) {
          if (!byParent.has(c.parentId)) byParent.set(c.parentId, []);
          byParent.get(c.parentId).push(c);
        }
      }
      const renderComment = (c, reply) => {
        const el = document.createElement('div');
        el.className = 'comment' + (reply ? ' reply' : '');
        const ts = parseTs(c.createdAt);
        el.innerHTML = '<div class="meta"><b>' + esc(c.authorName || 'Someone') + '</b>' + (ts ? ' · ' + fmtAgo(ts) : '') + '</div><div>' + mdInline(c.content || '') + '</div>';
        slot.appendChild(el);
        for (const r of byParent.get(c.id) || []) renderComment(r, true);
      };
      for (const c of roots) renderComment(c, false);
    };

    // One call for the whole thing page. The four sections used to be four
    // watches, so an open thing cost four reads every poll — by far this
    // page's largest running cost, and it fell on the app's own hosting. The
    // server answers all four in one round trip, the way bootstrap already
    // answers the landing view.
    if (!state.noThingView) {
      subs.scoped.push(watch('get_thing_view', { thingId: t.id, childLimit: 200, commentLimit: 200 }, (p) => {
        if (!state.view || state.view.id !== t.id || !p) return;
        // Thing first: it settles the name that the sub-thing breadcrumbs
        // build their trail from.
        renderThing(p.thing || {});
        renderChildren(p.children);
        renderMarks(p.marks);
        renderComments(p.comments);
      }, 'thing', LIVE_OPTS, (err) => {
        // A server predating the tool, or a grant that has not caught up with
        // a freshly added manifest entry: drop to the four-call path for the
        // rest of the session. A connector blocked outright fails the same way
        // on those calls and the page-level banner takes over from them.
        if (!state.noThingView && (err.code === 'tool_error' || err.code === 'not_in_manifest' ||
            err.code === 'blocked_by_policy' || err.code === 'approval_required' ||
            err.code === 'bad_request' || err.code === 'transform_error')) {
          state.noThingView = true;
          if (state.view && state.view.id === t.id) openThing(t, trail);
          return true;
        }
        return false;
      }));
      return;
    }

    subs.scoped.push(watch('get_thing', { thingId: t.id }, renderThing, 'thing', LIVE_OPTS));
    subs.scoped.push(
      watch('list_child_things', { parentId: t.id, limit: 200 }, renderChildren, 'children', LIVE_OPTS));
    subs.scoped.push(watch('list_marks', { thingId: t.id }, renderMarks, 'marks', LIVE_OPTS));
    subs.scoped.push(
      watch('list_comments', { thingId: t.id, limit: 200 }, renderComments, 'comments', LIVE_OPTS));
  }

  // ---------------------------------------------------------------- markdown (GFM subset)
  function mdInline(src) {
    // Code spans are lifted out before the other inline rules run, so their
    // text is never re-parsed as markup. The stand-in has to be something
    // ordinary prose cannot produce: esc() has already turned every raw '<'
    // into an entity, so an HTML comment here can only be one of ours, and
    // it stays inert if one is ever left behind. A bare " 12 " is not safe.
    // It matches any plain number in the text, so a line reading "500 gr"
    // restored code span #500 and rendered the word undefined.
    let s = esc(src);
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '<!--c' + (codes.length - 1) + '-->'; });
    s = s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, (_, alt, url) =>
      '<a class="imgchip" href="' + url + '" target="_blank" rel="noopener">\u{1F5BC}️ ' + (alt || 'image') + '</a>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<i>$2</i>');
    s = s.replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g, '$1<i>$2</i>');
    s = s.replace(/~~([^~]+)~~/g, '<s>$1</s>');
    s = s.replace(/<!--c(\d+)-->/g, (_, i) => {
      const c = codes[Number(i)];
      return c === undefined ? '' : '<code>' + c + '</code>';
    });
    return s;
  }

  function mdRender(src) {
    const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let i = 0;
    const listStack = [];   // ['ul'|'ol', indent]
    const closeLists = (indent) => {
      while (listStack.length && (indent === -1 || listStack[listStack.length - 1][1] >= indent)) {
        out.push(listStack.pop()[0] === 'ul' ? '</ul>' : '</ol>');
      }
    };
    let align = null;
    while (i < lines.length) {
      const line = lines[i];

      const fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        closeLists(-1);
        const buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      const alignFence = line.match(/^:::\s*(center|right|left)\s*$/);
      if (alignFence) { closeLists(-1); align = alignFence[1] === 'left' ? null : alignFence[1]; i++; continue; }
      if (/^:::\s*$/.test(line)) { closeLists(-1); align = null; i++; continue; }
      const alignAttr = align ? ' class="align-' + align + '"' : '';

      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeLists(-1); out.push('<h' + h[1].length + alignAttr + '>' + mdInline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }

      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeLists(-1); out.push('<hr>'); i++; continue; }

      if (/^\s*>/.test(line)) {
        closeLists(-1);
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + buf.map(mdInline).join('<br>') + '</blockquote>');
        continue;
      }

      // GFM pipe table: header row + separator row.
      if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
        closeLists(-1);
        const cells = (l) => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => mdInline(c.trim()));
        const head = cells(line);
        i += 2;
        let rows = '';
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
          rows += '<tr>' + cells(lines[i]).map((c) => '<td>' + c + '</td>').join('') + '</tr>';
          i++;
        }
        out.push('<div class="tablewrap"><table><tr>' + head.map((c) => '<th>' + c + '</th>').join('') + '</tr>' + rows + '</table></div>');
        continue;
      }

      const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (li) {
        const indent = li[1].length;
        const type = /^[-*+]$/.test(li[2]) ? 'ul' : 'ol';
        const top = listStack[listStack.length - 1];
        if (!top || indent > top[1]) { out.push(type === 'ul' ? '<ul>' : '<ol>'); listStack.push([type, indent]); }
        else if (indent < top[1]) { closeLists(indent + 1); if (!listStack.length) { out.push(type === 'ul' ? '<ul>' : '<ol>'); listStack.push([type, indent]); } }
        else if (top[0] !== type) { out.push(top[0] === 'ul' ? '</ul>' : '</ol>'); listStack.pop(); out.push(type === 'ul' ? '<ul>' : '<ol>'); listStack.push([type, indent]); }
        const task = li[3].match(/^\[([ xX])\]\s+(.*)$/);
        if (task) {
          out.push('<li class="task"><input type="checkbox" disabled' + (task[1] !== ' ' ? ' checked' : '') + '>' + mdInline(task[2]) + '</li>');
        } else {
          out.push('<li>' + mdInline(li[3]) + '</li>');
        }
        i++;
        continue;
      }

      if (!line.trim()) { closeLists(-1); i++; continue; }

      closeLists(-1);
      const buf = [line];
      i++;
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|:::|\s*>|\s*([-*+]|\d+[.)])\s|(-{3,}|\*{3,}|_{3,})\s*$)/.test(lines[i]) && !/\|/.test(lines[i])) {
        buf.push(lines[i]);
        i++;
      }
      out.push('<p' + alignAttr + '>' + buf.map(mdInline).join('<br>') + '</p>');
    }
    closeLists(-1);
    return out.join('');
  }

  // ---------------------------------------------------------------- workspaces
  // The visible label is a separate element from the select behind it, so it
  // has to be told whenever the selection moves.
  function syncWsLabel() {
    const sel = $('wsSelect');
    const opt = sel.options[sel.selectedIndex];
    $('wsName').textContent = opt ? opt.textContent : '';
  }

  function selectWorkspace(id, open) {
    state.currentWs = id;
    store.set('ews.ws', id);
    $('wsSelect').value = id;
    syncWsLabel();
    if (open !== false) openGrid();
  }

  function renderWorkspaces() {
    const sel = $('wsSelect');
    sel.innerHTML = '';
    for (const w of state.workspaces) {
      const o = document.createElement('option');
      o.value = w.id;
      o.textContent = w.name;
      sel.appendChild(o);
    }
    if (state.currentWs) sel.value = state.currentWs;
    syncWsLabel();
  }

  // Digests a {workspaces, defaultWorkspaceId}-shaped payload — delivered by
  // both the base list_workspaces watch and the grid's bootstrap watch — into
  // the dropdown and the landing decisions.
  function handleWorkspaces(p) {
    state.workspaces = (p && p.workspaces) || [];
    if (!state.workspaces.length) {
      clearScoped();
      state.view = null;
      syncViewChrome();
      $('view').innerHTML = '<div class="empty">No workspaces yet — create one in the app.</div>';
      return;
    }
    if (changed('workspaces', state.workspaces)) renderWorkspaces();

    const known = (id) => !!id && state.workspaces.some((w) => w.id === id);
    // The workspace the user set as default in the app. The server reports it
    // only while they still have access, so it needs no further vetting; a
    // server predating the field leaves it null and the old order applies.
    const def = (p && p.defaultWorkspaceId) || null;

    if (!known(state.currentWs)) {
      // A bootstrap grid picks its own landing (the server adopts one), so
      // don't land over its in-flight first call. Where to land otherwise,
      // best first: their default, then whatever they last opened here, then
      // the first workspace in switcher order.
      if (!state.noBoot && state.view && state.view.type === 'grid') return;
      const saved = store.get('ews.ws');
      selectWorkspace(def || (known(saved) ? saved : state.workspaces[0].id));
    } else if (state.autoWs && def && def !== state.currentWs && (!state.view || state.view.type === 'grid')) {
      // A first delivery served from cache can predate the default being
      // known. Adopt it while they are still on the landing grid — never
      // under someone who has picked a workspace or opened a thing.
      selectWorkspace(def);
    }
  }

  // ---------------------------------------------------------------- follow
  // Follow mode: armed from the moment the panel opens (see boot) and left to
  // the header toggle after that. While armed the panel follows activity — a
  // thing created or updated after arming (typically an agent writing) opens
  // automatically, switching workspace when needed; an update to the thing
  // already open refreshes its text in place. Pull-only: it rides a
  // recent_things watch at the contract's ~30 s polling floor, so a jump
  // lands within half a minute of the write and a burst lands on the newest.
  // The first delivery after arming only sets the baseline — server
  // timestamps compare against server timestamps, never the local clock.
  //
  // It is also the panel's whole polling budget. Armed, this feed and the
  // live surfaces poll; off, nothing does, and the page updates only when the
  // viewer navigates or presses refresh. So the mode ends three ways: a
  // manual tile/crumb/workspace click pauses it (the viewer is steering, not
  // watching), the toggle stops it, and FOLLOW_IDLE minutes without a write
  // switch it off on their behalf.
  function userNav() {
    if (!state.follow) return;
    setFollow(false);
    toast('Follow paused');
  }

  // Nothing written for FOLLOW_IDLE, so stop: an armed panel nobody is
  // feeding re-reads the activity feed at the app's expense until its tab
  // closes, which is most of what an idle panel ever cost. The toggle says
  // why it stopped and turns it back on.
  let followIdle = null;
  function bumpIdle() {
    if (followIdle) clearTimeout(followIdle);
    followIdle = setTimeout(() => {
      followIdle = null;
      if (!state.follow) return;
      setFollow(false);
      toast('Follow off — nothing new for 15 minutes');
    }, FOLLOW_IDLE);
  }

  function setFollow(on) {
    state.follow = on;
    state.followSeen = null;
    const btn = $('followBtn');
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
    for (const un of subs.follow) { try { un(); } catch { /* idempotent */ } }
    subs.follow = [];
    renderKeys.delete('follow');
    // The mode is what decides whether anything polls at all, so every live
    // surface currently on screen is re-registered on the new cadence.
    for (const w of Array.from(liveWatches)) { try { w.rebind(); } catch { /* gone */ } }
    if (followIdle) { clearTimeout(followIdle); followIdle = null; }
    if (!on) return;
    bumpIdle();
    // Uncached (gcTime 0): a replay from an earlier arming would make the
    // baseline stale and the first "jump" an old edit.
    subs.follow.push(watch('recent_things', { limit: 3 }, (p) => {
      if (!state.follow) return;
      const items = ((p && p.things) || [])
        .map((t) => ({ t, ts: parseTs(t.updatedAt) }))
        .filter((x) => x.ts !== null)
        .sort((a, b) => b.ts - a.ts);
      if (state.followSeen === null) { state.followSeen = items.length ? items[0].ts : 0; return; }
      const next = items.find((x) => x.ts > state.followSeen);
      if (!next) return;
      state.followSeen = next.ts;
      // A write landed, so there is something to follow: the idle clock
      // starts over from here, not from arming.
      bumpIdle();
      const open = state.view && state.view.type === 'thing' ? state.view.id : null;
      // An agent still filling in the open thing: refresh it in place rather
      // than re-opening it. This feed and the thing's own watch poll on
      // independent cycles, so invalidating here delivers the new text on
      // whichever fires first — roughly halving the wait a single poll would
      // impose, without a timer of our own.
      if (next.t.id === open) { invalidateThing(); return; }
      followJump(next.t);
    }, 'follow', { cache: { staleTime: 0, gcTime: 0 }, refetchInterval: POLL_FAST }));
  }

  // Drop the cached thing-scoped reads so the open thing's watches re-execute
  // and deliver now. Only registered watches re-execute, so this costs one
  // flight per visible section and only when the feed reported a real change.
  function invalidateThing() {
    for (const tool of ['get_thing_view', 'get_thing', 'list_child_things', 'list_comments', 'list_marks']) {
      try { Promise.resolve(mcp.invalidate(SERVER, tool)).catch(() => {}); } catch { /* old shell */ }
    }
  }

  async function followJump(t) {
    // t is a recent_things item: {id, name, emoji, parentId, workspaceId, …}
    if (t.workspaceId && t.workspaceId !== state.currentWs) {
      state.currentWs = t.workspaceId;
      store.set('ews.ws', t.workspaceId);
      $('wsSelect').value = t.workspaceId;
      syncWsLabel();
    }
    const trail = await ancestorTrail(t.parentId);
    if (!state.follow) return; // switched off while we walked
    openThing({ id: t.id, name: t.name, emoji: t.emoji }, trail);
  }

  // Walk parentId upward via get_thing. Servers from 2026-08-07 return
  // parentId; older ones leave it undefined and the walk just stops — shorter
  // crumbs, never an error.
  async function ancestorTrail(parentId) {
    const chain = [];
    let id = parentId;
    for (let depth = 0; id && depth < 6; depth++) {
      try {
        const res = await mcp.callTool(SERVER, 'get_thing', { thingId: id }, { cache: CACHE });
        const p = res.payload || {};
        chain.push({ id: p.id || id, name: p.name || '…', emoji: p.emoji });
        id = p.parentId || null;
      } catch { break; }
    }
    return chain.reverse();
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    if (!mcp) {
      showBanner('Open this page from claude.ai', 'This panel reads your Everythings data through claude.ai connectors, which are only available when the artifact is opened from claude.ai.', true);
      setStatus('err', 'no connector bridge');
      return;
    }

    $('refreshBtn').addEventListener('click', async () => {
      const btn = $('refreshBtn');
      btn.classList.add('spin');
      try {
        await mcp.invalidate(SERVER);
      } catch {
        // Older shell: nothing cached to drop — force-fetch by re-registering.
        if (state.view && state.view.type === 'thing') {
          const v = state.view;
          openThing({ id: v.id, name: v.name, emoji: v.emoji }, v.trail);
        } else if (state.view) {
          openGrid();
        }
      }
      setTimeout(() => btn.classList.remove('spin'), 900);
    });

    $('wsSelect').addEventListener('change', (e) => {
      userNav();
      state.autoWs = false;
      selectWorkspace(e.target.value);
    });

    $('followBtn').addEventListener('click', () => {
      setFollow(!state.follow);
      toast(state.follow
        ? 'Following activity — things open here as they are created or updated'
        : 'Follow off — the panel holds still until you refresh');
    });

    setStatus('boot', 'connecting…');

    // Armed on every load, and armed BEFORE the first view is built so the
    // watches that view registers are born on the following cadence rather
    // than being re-registered (and re-executed) a moment later. Watching an
    // agent write is what the panel is for, and by the time someone opens it
    // the agent is usually already working — an off-by-default toggle just
    // costs them the first few things. Arming only baselines against the
    // newest server timestamp, so nothing jumps until something is written
    // after this moment; a manual tile/crumb/workspace click still pauses it,
    // five quiet minutes switch it off, and the toggle stops it for good.
    setFollow(true);

    // Speculative first paint: open the grid immediately — its bootstrap
    // watch answers the whole landing view (dropdown + tiles) in one round
    // trip, for the saved workspace when one is remembered, else the server's
    // default. handleWorkspaces corrects the guess if the app default changed.
    state.currentWs = store.get('ews.ws') || null;
    openGrid();

    // Fills the dropdown (and arms the landing logic) in thing views, where
    // no bootstrap watch is registered; also the whole landing path when the
    // server lacks the bootstrap tool. It does not poll: a viewer's set of
    // workspaces changes on the scale of weeks, and the refresh button
    // re-executes this along with everything else registered.
    subs.base.push(watch('list_workspaces', null, handleWorkspaces, 'workspaces'));
  }

  boot();
})();
</script>
