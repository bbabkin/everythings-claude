<title>Everythings Panel</title>
<style>
  /* ------------------------------------------------------------------ tokens.
     Mirrors apps/web globals.css: neutral shadcn grays, one strong green.
     Tile shadow/hilite gradients follow thingIcon.module.css per theme. */
  :root {
    --bg: hsl(0 0% 100%);
    --fg: hsl(0 0% 6%);
    --card: hsl(0 0% 98.5%);
    --card-hover: hsl(0 0% 96%);
    --border: hsl(0 0% 89%);
    --muted: hsl(0 0% 42%);
    --brand: hsl(142 72% 29%);
    --brand-soft: hsl(142 45% 94%);
    --warn: hsl(43 90% 34%);
    --warn-soft: hsl(43 90% 94%);
    --danger: hsl(0 72% 45%);
    --danger-soft: hsl(0 80% 96%);
    --link: hsl(220 100% 30%);
    --code-bg: hsl(0 0% 94%);
    --radius: 10px;
    --tile-shadow-image: radial-gradient(rgba(0, 0, 0, 0.2) 0%, transparent 60%);
    --tile-hilite-hover: 0.5;
    --logo-shadow: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.18));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: hsl(0 0% 4%);
      --fg: hsl(0 0% 96%);
      --card: hsl(0 0% 8%);
      --card-hover: hsl(0 0% 12%);
      --border: hsl(0 0% 16%);
      --muted: hsl(0 0% 64%);
      --brand: hsl(142 71% 45%);
      --brand-soft: hsl(142 40% 14%);
      --warn: hsl(43 85% 60%);
      --warn-soft: hsl(43 60% 14%);
      --danger: hsl(0 84% 64%);
      --danger-soft: hsl(0 45% 14%);
      --link: hsl(220 100% 80%);
      --code-bg: hsl(0 0% 13%);
      --tile-shadow-image: radial-gradient(rgba(255, 255, 255, 0.3) 0%, transparent 40%);
      --tile-hilite-hover: 0;
      --logo-shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: hsl(0 0% 4%);
    --fg: hsl(0 0% 96%);
    --card: hsl(0 0% 8%);
    --card-hover: hsl(0 0% 12%);
    --border: hsl(0 0% 16%);
    --muted: hsl(0 0% 64%);
    --brand: hsl(142 71% 45%);
    --brand-soft: hsl(142 40% 14%);
    --warn: hsl(43 85% 60%);
    --warn-soft: hsl(43 60% 14%);
    --danger: hsl(0 84% 64%);
    --danger-soft: hsl(0 45% 14%);
    --link: hsl(220 100% 80%);
    --code-bg: hsl(0 0% 13%);
    --tile-shadow-image: radial-gradient(rgba(255, 255, 255, 0.3) 0%, transparent 40%);
    --tile-hilite-hover: 0;
    --logo-shadow: none;
  }
  :root[data-theme="light"] {
    --bg: hsl(0 0% 100%);
    --fg: hsl(0 0% 6%);
    --card: hsl(0 0% 98.5%);
    --card-hover: hsl(0 0% 96%);
    --border: hsl(0 0% 89%);
    --muted: hsl(0 0% 42%);
    --brand: hsl(142 72% 29%);
    --brand-soft: hsl(142 45% 94%);
    --warn: hsl(43 90% 34%);
    --warn-soft: hsl(43 90% 94%);
    --danger: hsl(0 72% 45%);
    --danger-soft: hsl(0 80% 96%);
    --link: hsl(220 100% 30%);
    --code-bg: hsl(0 0% 94%);
    --tile-shadow-image: radial-gradient(rgba(0, 0, 0, 0.2) 0%, transparent 60%);
    --tile-hilite-hover: 0.5;
    --logo-shadow: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.18));
  }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Montserrat', Arial, Helvetica, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  * { box-sizing: border-box; }
  a { color: var(--link); }
  b, strong { font-weight: 600; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  #app { max-width: 1080px; margin: 0 auto; padding: 0 16px 40px; }

  /* --------------------------------------------------- header: no bar.
     Workspace picker left, logo badge center, refresh + status right. */
  header.bar {
    position: sticky; top: 0; z-index: 10;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 10px;
    padding: 12px 0 10px;
    background: var(--bg);
  }
  .bar .left { justify-self: start; min-width: 0; }
  .bar .right { justify-self: end; display: flex; align-items: center; gap: 8px; }
  .logo { display: block; width: 38px; height: 38px; filter: var(--logo-shadow); }

  select#wsSelect {
    max-width: 100%;
    padding: 6px 4px;
    border: none; border-radius: 8px;
    background: transparent; color: var(--fg);
    font-family: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer;
  }
  select#wsSelect:hover { background: var(--card-hover); }

  button.iconbtn {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: none; border-radius: 8px;
    background: transparent; cursor: pointer;
  }
  button.iconbtn:hover { background: var(--card-hover); }
  button.iconbtn svg { width: 15px; height: 15px; }
  button.iconbtn.on { color: var(--brand); background: var(--brand-soft); }
  button.iconbtn.on svg { animation: dotpulse 1.4s ease-in-out infinite; }
  button.iconbtn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .status.stale .dot { background: var(--warn); }
  .status.err .dot { background: var(--danger); }
  .status .dot.pulse { animation: dotpulse 1.4s ease-in-out infinite; }
  @keyframes dotpulse { 50% { opacity: 0.35; } }
  @media (max-width: 560px) { .status .ago { display: none; } }

  /* ------------------------------------------------------------------ banner */
  .banner {
    margin: 12px 0 0;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--danger-soft);
  }
  .banner.warn { background: var(--warn-soft); }
  .banner b { display: block; margin-bottom: 2px; }
  .banner .body { color: var(--muted); font-size: 13px; }

  /* ------------------------------------------------------ tiles ("things").
     Ported from thingIcon.module.css: no card, no border — a floating emoji
     with a radial shadow blob and lift on hover. */
  .grid {
    display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    margin-top: 14px;
  }
  .thing {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    min-width: 80px; min-height: 88px;
    padding: 14px 8px 10px;
    border: none; border-radius: 12px;
    background: none;
    cursor: pointer; text-align: center;
    transition: all 0.3s;
  }
  .thingEmoji {
    position: relative; z-index: 2;
    font-size: 2rem; line-height: 1.15;
    white-space: nowrap; pointer-events: none;
    transition: all 0.3s linear;
  }
  /* Multi-emoji icon: the first glyph sizes the box, the rest overlay it and
     are nudged bottom-right by inline transforms (see emojiHtml). */
  .stack { position: relative; display: inline-block; line-height: 1; }
  .stack i { position: absolute; inset: 0; font-style: normal; line-height: 1; }
  .thingName {
    position: relative; z-index: 2;
    display: flex; justify-content: center;
    margin-top: 6px;
    font-size: 13px; font-weight: 500;
    pointer-events: none;
    hyphens: auto; overflow-wrap: anywhere; text-align: center;
    transition: all 0.3s linear;
  }
  .thingShadow {
    pointer-events: none;
    position: absolute;
    top: 34px; left: 50%;
    width: 80px; height: 40px;
    opacity: 0;
    background-image: var(--tile-shadow-image);
    transition: all 0.3s;
    transform: scale(1.2) translateY(-5px) translateX(-50%);
    z-index: 1;
  }
  .thingHilite {
    pointer-events: none;
    position: absolute;
    top: 4px; left: 50%; margin-left: -40px;
    width: 80px; height: 60px;
    opacity: 0;
    background: radial-gradient(rgba(255, 255, 255, 0.5) 0%, transparent 70%);
    transition: all 0.3s;
    transform: scale(1) translateY(5px);
    z-index: 3;
  }
  .thing:hover .thingEmoji, .thing:focus .thingEmoji { transform: scale(1.3) translateY(-5px); }
  .thing:hover .thingShadow, .thing:focus .thingShadow {
    opacity: 0.8;
    transform: scale(1.2) translateY(5px) translateX(-50%);
  }
  .thing:hover .thingHilite, .thing:focus .thingHilite {
    opacity: var(--tile-hilite-hover);
    transform: scale(1) translateY(-15px);
  }
  .thing.flash-new { animation: flashNew 2.6s ease-out; }
  .thing.flash-changed { animation: flashChanged 2.6s ease-out; }
  @keyframes flashNew {
    0% { box-shadow: 0 0 0 3px var(--brand); background: var(--brand-soft); }
    70% { box-shadow: 0 0 0 3px transparent; }
    100% { background: none; }
  }
  @keyframes flashChanged {
    0% { box-shadow: 0 0 0 3px var(--warn); background: var(--warn-soft); }
    70% { box-shadow: 0 0 0 3px transparent; }
    100% { background: none; }
  }
  .skel { pointer-events: none; }
  .skel .thingEmoji { width: 34px; height: 34px; background: var(--card-hover); border-radius: 50%; animation: dotpulse 1.4s ease-in-out infinite; }
  .skel .thingName { width: 56px; height: 12px; background: var(--card-hover); border-radius: 6px; animation: dotpulse 1.4s ease-in-out infinite; }

  .openws { text-align: center; margin: 44px 0 24px; }
  .openws a { color: var(--muted); font-size: 12.5px; text-decoration: none; }
  .openws a:hover { color: var(--fg); text-decoration: underline; }

  .empty { color: var(--muted); font-style: italic; padding: 14px 2px; text-align: center; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; text-align: center; }

  /* ------------------------------------------------------------------ detail */
  .sect-label {
    margin: 22px 0 4px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted);
  }
  .sect-label .cnt { font-weight: 400; letter-spacing: normal; text-transform: none; font-variant-numeric: tabular-nums; }
  .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 14px 0 4px; font-size: 13px; color: var(--muted); }
  .crumbs button {
    border: none; background: none; padding: 2px 4px; cursor: pointer;
    color: var(--link); border-radius: 4px;
  }
  .crumbs button:hover { text-decoration: underline; }
  .crumbs .sep { user-select: none; }
  .thing-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 8px 0 2px; }
  .thing-head .e { font-size: 34px; line-height: 1; }
  .thing-head h1 { font-size: 21px; font-weight: 600; margin: 0; text-wrap: balance; }
  .thing-head .openapp { font-size: 12px; white-space: nowrap; color: var(--muted); }
  .thing-head .openapp:hover { color: var(--fg); }

  .marks-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .mark-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--card-hover); font-size: 13px;
  }
  .mark-chip .c { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .mark-chip.mine { background: var(--brand-soft); }

  .comment { padding: 8px 0; }
  .comment.reply { margin-left: 22px; }
  .comment .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .comment .meta b { color: var(--fg); }

  /* ------------------------------------------------------------------ prose */
  .prose { max-width: 68ch; overflow-wrap: anywhere; margin-top: 8px; }
  .prose h1 { font-size: 18px; font-weight: 600; margin: 14px 0 6px; }
  .prose h2 { font-size: 16px; font-weight: 600; margin: 13px 0 5px; }
  .prose h3, .prose h4, .prose h5, .prose h6 { font-size: 14.5px; font-weight: 600; margin: 12px 0 4px; }
  .prose p { margin: 7px 0; }
  .prose ul, .prose ol { margin: 7px 0; padding-left: 24px; }
  .prose li { margin: 2px 0; }
  .prose li.task { list-style: none; margin-left: -18px; }
  .prose li.task input { margin-right: 6px; accent-color: var(--brand); }
  .prose code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; font-family: Consolas, Menlo, monospace; }
  .prose pre { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
  .prose pre code { background: none; padding: 0; }
  .prose blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .prose hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .prose .tablewrap { overflow-x: auto; }
  .prose table { border-collapse: collapse; margin: 8px 0; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 4px 9px; text-align: left; }
  .prose th { background: var(--card); font-weight: 600; }
  .prose .align-center { text-align: center; }
  .prose .align-right { text-align: right; }
  .prose .imgchip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; margin: 2px 0;
    border-radius: 999px;
    background: var(--card-hover); font-size: 12px;
    color: var(--muted); text-decoration: none;
  }
  .prose .imgchip:hover { color: var(--fg); }

  /* ------------------------------------------------------------------ misc */
  #toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .toast {
    padding: 8px 12px; max-width: 280px;
    border-radius: 8px;
    background: var(--card); box-shadow: 0 4px 14px hsl(0 0% 0% / 0.15);
    font-size: 13px;
  }
  .secterr { color: var(--danger); font-size: 13px; padding: 6px 0; }

  @media (prefers-reduced-motion: reduce) {
    .thing, .thingEmoji, .thingName, .thingShadow, .thingHilite { transition: none; }
    .thing.flash-new, .thing.flash-changed, .iconbtn.spin svg, .iconbtn.on svg,
    .status .dot.pulse, .skel .thingEmoji, .skel .thingName { animation: none; }
  }
</style>

<script>
(() => {
  'use strict';
  const SERVER = 'Everythings';
  const APP_URL = 'https://everythings.app';
  const POLL = 30000;
  // Declared polling for the live surfaces (followed thing, activity feed).
  // The runtime clamps refetchInterval to a ~30 s floor today, so this asks
  // for the fastest cadence allowed and picks up anything faster for free if
  // the floor ever drops. Sub-floor freshness comes from invalidateThing()
  // below — change-triggered, never a timer.
  const POLL_FAST = 15000;
  // Long-lived cache: watchTool replays the stored entry instantly on
  // (re)registration and still refreshes once it is past staleTime, so a
  // day-long gcTime makes reopening the panel paint from last-good data at
  // once instead of a skeleton. staleTime above POLL keeps grid<->thing
  // navigation from re-executing reads the 30 s poll just refreshed.
  const CACHE = { staleTime: 60000, gcTime: 86400000 };
  // Thing-detail reads: replay the stored entry instantly (same day-long
  // gcTime) but never serve it without refreshing. staleTime 0 matters while
  // following — a thing whose text an agent is still filling in must not be
  // answered from a copy taken seconds ago.
  const LIVE_CACHE = { staleTime: 0, gcTime: 86400000 };
  const LIVE_OPTS = { cache: LIVE_CACHE, refetchInterval: POLL_FAST };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* sandboxed */ } },
  };

  // ------------------------------------------------------- stacked emoji
  // Ported from components/thing/stackedEmoji.tsx: an icon holding several
  // emojis draws the first three layered, each nudged toward the bottom-right
  // of the one beneath it. Sized in em, so it follows the inherited font-size.
  const MAX_STACKED = 3;
  const STACK_STEP_EM = 0.22;
  const segmenter = (typeof Intl !== 'undefined' && 'Segmenter' in Intl)
    ? new Intl.Segmenter(undefined, { granularity: 'grapheme' })
    : null;
  // Grapheme clusters, so ZWJ sequences (👨‍👩‍👧), flags and skin-tone
  // modifiers each count as one emoji rather than several code points.
  function graphemes(value) {
    const parts = segmenter
      ? Array.from(segmenter.segment(value), (s) => s.segment)
      : Array.from(value);
    return parts.filter((g) => g.trim() !== '');
  }
  function emojiHtml(value) {
    const raw = String(value ?? '');
    const glyphs = graphemes(raw).slice(0, MAX_STACKED);
    if (glyphs.length <= 1) return esc(glyphs[0] ?? raw);
    let h = '<span class="stack">' + esc(glyphs[0]);
    for (let i = 1; i < glyphs.length; i++) {
      const off = (i * STACK_STEP_EM).toFixed(2) + 'em';
      h += '<i aria-hidden="true" style="transform:translate(' + off + ',' + off + ')">' + esc(glyphs[i]) + '</i>';
    }
    return h + '</span>';
  }

  // ---------------------------------------------------------------- state
  const state = {
    workspaces: [],
    currentWs: null,
    view: null,            // {type:'grid'} | {type:'thing', id, name, emoji, trail:[{id,name,emoji}]}
    autoWs: true,          // false once the user picks a workspace themselves
    noBoot: false,         // true once the server proves it lacks the bootstrap tool
    follow: false,         // follow mode: auto-open things as activity happens
    followSeen: null,      // newest server updatedAt handled (null until baselined)
    gridPrev: null,        // map id -> {name, emoji} of last grid delivery
    childPrev: null,
    lastDataAt: null,
    condition: 'boot',     // 'ok' | 'stale' | 'authz' | 'boot'
  };
  const subs = { base: [], scoped: [], follow: [] };

  // Skip re-rendering a section when a poll delivers identical data — replacing
  // DOM nodes every 30 s would drop focus/hover and break in-flight clicks.
  const renderKeys = new Map();
  function changed(section, value) {
    const key = JSON.stringify(value);
    if (renderKeys.get(section) === key) return false;
    renderKeys.set(section, key);
    return true;
  }

  const mcp = window.claude ? window.claude.mcp : undefined;

  // ---------------------------------------------------------------- errors
  const AUTHZ = new Set(['needs_reauth', 'server_not_connected', 'selection_required',
    'blocked_by_policy', 'approval_required', 'not_granted', 'capability_disabled', 'capability_removed']);
  const ERROR_COPY = {
    server_not_connected: ['Everythings isn’t connected', 'Add the Everythings connector in claude.ai Settings → Connectors, then reload this page.'],
    selection_required: ['Choose an Everythings connector', 'You have more than one connector named “Everythings”. Pick one when claude.ai asks, or reload the page to be asked again.'],
    needs_reauth: ['Reconnect Everythings', 'Your Everythings connection expired. Reconnect it in claude.ai Settings → Connectors, then reload.'],
    blocked_by_policy: ['Blocked by organization policy', 'Your organization blocks this connector tool for artifact pages.'],
    approval_required: ['Approval required', 'Your organization requires per-call approval for this tool, which artifact pages can’t provide yet.'],
    not_granted: ['Live data unavailable', 'This view didn’t receive connector access. Reopen the artifact from claude.ai.'],
    capability_disabled: ['Live data unavailable', 'Connector access isn’t usable in this view. Reopen the artifact from claude.ai.'],
    capability_removed: ['Live data unavailable', 'Connector access isn’t available in this runtime. Reopen the artifact from claude.ai.'],
  };

  function setStatus(kind, text) {
    const el = $('status');
    el.classList.toggle('stale', kind === 'stale');
    el.classList.toggle('err', kind === 'err');
    el.querySelector('.dot').classList.toggle('pulse', kind === 'boot' || kind === 'stale');
    if (text) $('statusAgo').textContent = text;
  }

  function showBanner(title, body, warn) {
    $('banner').innerHTML = '<div class="banner' + (warn ? ' warn' : '') + '"><b>' + esc(title) + '</b><div class="body">' + esc(body) + '</div></div>';
  }
  function clearBanner() { $('banner').innerHTML = ''; }

  function handleErr(section, err) {
    const code = err && err.code;
    if (AUTHZ.has(code)) {
      // Authorization denials retract rendered data: one connector feeds every
      // section, so this is a page-level condition.
      state.condition = 'authz';
      const copy = ERROR_COPY[code] || ['Everythings is unavailable', err.message || String(code)];
      $('view').innerHTML = '';
      showBanner(copy[0], copy[1], false);
      setStatus('err', 'not connected');
      return;
    }
    if (code === 'tool_error' || code === 'bad_request' || code === 'transform_error') {
      const slot = document.querySelector('[data-err="' + section + '"]');
      if (slot) slot.innerHTML = '<div class="secterr">Couldn’t load this section: ' + esc(err.message || code) + '</div>';
      return;
    }
    // Transient (server_unavailable, rate_limited, upstream_error, unknown):
    // keep last-good data; the ~30 s poll is the retry.
    if (state.condition !== 'authz') {
      state.condition = 'stale';
      setStatus('stale', 'connection hiccup — retrying');
    }
  }

  function markData(result) {
    state.lastDataAt = (result && result.cache && result.cache.storedAt) || Date.now();
    if (state.condition !== 'ok') {
      state.condition = 'ok';
      clearBanner();
    }
    setStatus('ok');
    renderAgo();
  }

  // ---------------------------------------------------------------- time
  function parseTs(s) {
    if (!s) return null;
    const t = Date.parse(/[zZ]$|[+\-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
    return Number.isNaN(t) ? null : t;
  }
  function fmtAgo(ms) {
    const d = Math.max(0, Date.now() - ms);
    if (d < 15e3) return 'just now';
    if (d < 60e3) return Math.round(d / 1e3) + 's ago';
    if (d < 36e5) return Math.round(d / 6e4) + 'm ago';
    if (d < 864e5) return Math.round(d / 36e5) + 'h ago';
    return Math.round(d / 864e5) + 'd ago';
  }
  function renderAgo() {
    if (state.condition === 'ok' && state.lastDataAt) $('statusAgo').textContent = 'updated ' + fmtAgo(state.lastDataAt);
  }
  setInterval(renderAgo, 10000);

  // ---------------------------------------------------------------- toasts
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }

  // ---------------------------------------------------------------- watches
  // onErr (optional) sees the error first; returning true swallows it so a
  // caller can branch (e.g. fall back when a tool is missing) without the
  // page-level error handling kicking in.
  function watch(tool, input, onData, section, opts, onErr) {
    const un = mcp.watchTool(SERVER, tool, input, (ev) => {
      if (ev.type === 'data') { markData(ev.result); onData(ev.result.payload, ev.result); }
      else if (!(onErr && onErr(ev.error))) handleErr(section, ev.error);
    }, Object.assign({ cache: CACHE, refetchInterval: POLL }, opts || {}));
    return un;
  }
  function clearScoped() {
    for (const un of subs.scoped) { try { un(); } catch { /* idempotent */ } }
    subs.scoped = [];
    for (const k of ['grid', 'children', 'thing', 'marks', 'comments']) renderKeys.delete(k);
  }

  // ---------------------------------------------------------------- tiles
  function tileEl(t, onClick) {
    const b = document.createElement('button');
    b.className = 'thing';
    b.innerHTML = '<span class="thingHilite"></span>' +
      '<span class="thingEmoji">' + emojiHtml(t.emoji || '\u{1F4C4}') + '</span>' +
      '<span class="thingName">' + esc(t.name) + '</span>' +
      '<span class="thingShadow"></span>';
    b.addEventListener('click', () => { userNav(); onClick(); });
    return b;
  }
  function skeletonGrid(n) {
    let h = '<div class="grid">';
    for (let i = 0; i < n; i++) h += '<div class="thing skel"><span class="thingEmoji"></span><span class="thingName"></span></div>';
    return h + '</div>';
  }

  function diffFlash(prev, things) {
    // Returns {flags: id -> 'new'|'changed', removed: [names]}
    const flags = {}; const removed = [];
    if (prev) {
      for (const t of things) {
        const p = prev.get(t.id);
        if (!p) flags[t.id] = 'new';
        else if (p.name !== t.name || p.emoji !== t.emoji) flags[t.id] = 'changed';
      }
      const ids = new Set(things.map((t) => t.id));
      for (const [id, p] of prev) if (!ids.has(id)) removed.push(p.name);
    }
    return { flags, removed };
  }

  // ---------------------------------------------------------------- grid view
  // Renders one list_things-shaped payload ({things, returned, count,
  // truncated}) into the grid slot; shared by the bootstrap and legacy paths.
  function renderGridThings(p) {
    const things = (p && p.things) || [];
    if (!changed('grid', things)) return;
    const { flags, removed } = diffFlash(state.gridPrev, things);
    state.gridPrev = new Map(things.map((t) => [t.id, { name: t.name, emoji: t.emoji }]));
    for (const name of removed) toast('Removed: ' + name);
    $('gridMeta').textContent = p.truncated ? 'Showing ' + p.returned + ' of ' + p.count : '';
    const slot = $('gridSlot');
    if (!things.length) { slot.innerHTML = '<div class="empty">No things here yet.</div>'; return; }
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const t of things) {
      const el = tileEl(t, () => openThing(t, []));
      if (flags[t.id]) el.classList.add('flash-' + flags[t.id]);
      grid.appendChild(el);
    }
    slot.innerHTML = '';
    slot.appendChild(grid);
  }

  function openGrid() {
    clearScoped();
    const view = { type: 'grid' };
    state.view = view;
    state.gridPrev = null;
    $('view').innerHTML =
      '<div id="gridSlot">' + skeletonGrid(8) + '</div><div data-err="grid"></div>' +
      '<div class="note" id="gridMeta"></div>' +
      '<div class="openws"><a id="openWs" href="' + esc(APP_URL + '/workspaces/' + (state.currentWs || '')) + '" target="_blank" rel="noopener">Open this workspace in the app ↗</a></div>';

    if (state.noBoot) {
      // Legacy two-call path for servers without the bootstrap tool. With no
      // workspace picked yet, the base list_workspaces watch lands and
      // reopens this view.
      if (!state.currentWs) return;
      subs.scoped.push(watch('list_things', { workspaceId: state.currentWs, limit: 200 }, (p) => {
        if (state.view !== view) return;
        renderGridThings(p);
      }, 'grid'));
      return;
    }

    // One call for the whole landing view: workspaces + default + the landing
    // workspace's things. The server lands on the requested workspace while
    // it is accessible, else the default, else the first — a stale saved id
    // never errors, the payload just says where we actually landed.
    const input = { limit: 200 };
    if (state.currentWs) input.workspaceId = state.currentWs;
    subs.scoped.push(watch('bootstrap', input, (p) => {
      if (state.view !== view) return;
      if (p && p.landing && p.landing.workspaceId !== state.currentWs) {
        // The server redirected (nothing saved, or access lost): adopt.
        state.currentWs = p.landing.workspaceId;
        store.set('ews.ws', state.currentWs);
        const link = $('openWs');
        if (link) link.href = APP_URL + '/workspaces/' + state.currentWs;
      }
      handleWorkspaces(p);
      if (state.view !== view) return; // handleWorkspaces re-landed under us
      if (p && p.landing) renderGridThings(p.landing);
    }, 'grid', null, (err) => {
      // A server predating the tool, or a policy/consent layer blocking just
      // this one (a freshly added manifest tool can lag the viewer's grant):
      // fall back to the two-call path once. If policy blocks the connector
      // wholesale, the legacy calls fail the same way and the page-level
      // banner takes over from them.
      if (!state.noBoot && (err.code === 'tool_error' || err.code === 'not_in_manifest' ||
          err.code === 'blocked_by_policy' || err.code === 'approval_required' ||
          err.code === 'bad_request' || err.code === 'transform_error')) {
        state.noBoot = true;
        if (state.view === view) openGrid();
        return true;
      }
      return false;
    }));
  }

  // ---------------------------------------------------------------- detail view
  function crumbBtn(label, onClick) {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', () => { userNav(); onClick(); });
    return b;
  }

  function openThing(t, trail) {
    clearScoped();
    state.view = { type: 'thing', id: t.id, name: t.name, emoji: t.emoji, trail };
    state.childPrev = null;
    const ws = state.workspaces.find((w) => w.id === state.currentWs);
    const v = $('view');
    v.innerHTML =
      '<div class="crumbs" id="crumbs"></div>' +
      '<div class="thing-head"><span class="e" id="dEmoji"></span><h1 id="dName"></h1>' +
      '<a class="openapp" id="dOpen" target="_blank" rel="noopener">open in app ↗</a></div>' +
      '<div class="marks-row" id="dMarks"></div><div data-err="marks"></div>' +
      '<div class="prose" id="dContent"></div><div data-err="thing"></div>' +
      '<div class="sect-label">Inside <span class="cnt" id="dChildCount"></span></div>' +
      '<div id="dChildren">' + skeletonGrid(4) + '</div><div data-err="children"></div>' +
      '<div class="sect-label">Comments <span class="cnt" id="dCommentCount"></span></div>' +
      '<div id="dComments"></div><div data-err="comments"></div>';

    const crumbs = $('crumbs');
    crumbs.appendChild(crumbBtn(ws ? ws.name : 'Workspace', openGrid));
    for (const a of trail) {
      crumbs.insertAdjacentHTML('beforeend', '<span class="sep">›</span>');
      crumbs.appendChild(crumbBtn(a.name, () => openThing(a, trail.slice(0, trail.indexOf(a)))));
    }
    crumbs.insertAdjacentHTML('beforeend', '<span class="sep">›</span><span>' + esc(t.name) + '</span>');

    $('dEmoji').innerHTML = emojiHtml(t.emoji || '');
    $('dName').textContent = t.name;
    $('dOpen').href = APP_URL + '/workspaces/' + state.currentWs + '/things/' + t.id;

    subs.scoped.push(watch('get_thing', { thingId: t.id }, (p) => {
      if (!state.view || state.view.id !== t.id) return;
      if (!changed('thing', p)) return;
      $('dEmoji').innerHTML = emojiHtml(p.emoji || '');
      $('dName').textContent = p.name || t.name;
      state.view.name = p.name || t.name;
      $('dContent').innerHTML = p.content ? mdRender(p.content) : '';
    }, 'thing', LIVE_OPTS));

    subs.scoped.push(watch('list_child_things', { parentId: t.id, limit: 200 }, (p) => {
      if (!state.view || state.view.id !== t.id) return;
      const kids = (p && p.things) || [];
      if (!changed('children', kids)) return;
      const { flags, removed } = diffFlash(state.childPrev, kids);
      state.childPrev = new Map(kids.map((k) => [k.id, { name: k.name, emoji: k.emoji }]));
      for (const name of removed) toast('Removed: ' + name);
      $('dChildCount').textContent = p.count ? '— ' + p.count : '';
      const slot = $('dChildren');
      if (!kids.length) { slot.innerHTML = '<div class="empty">No sub-things.</div>'; return; }
      const grid = document.createElement('div');
      grid.className = 'grid';
      const nextTrail = trail.concat([{ id: t.id, name: state.view.name, emoji: t.emoji }]);
      for (const k of kids) {
        const el = tileEl(k, () => openThing(k, nextTrail));
        if (flags[k.id]) el.classList.add('flash-' + flags[k.id]);
        grid.appendChild(el);
      }
      slot.innerHTML = '';
      slot.appendChild(grid);
    }, 'children', LIVE_OPTS));

    subs.scoped.push(watch('list_marks', { thingId: t.id }, (p) => {
      if (!state.view || state.view.id !== t.id) return;
      const marks = (p && p.marks) || [];
      if (!changed('marks', marks)) return;
      const row = $('dMarks');
      row.innerHTML = '';
      for (const m of marks) {
        const chip = document.createElement('span');
        chip.className = 'mark-chip' + (m.mine ? ' mine' : '');
        chip.innerHTML = '<span>' + esc(m.emoji || m.name) + '</span><span class="c">' + Number(m.count) + '</span>';
        chip.title = (m.users || []).join(', ');
        row.appendChild(chip);
      }
    }, 'marks', LIVE_OPTS));

    subs.scoped.push(watch('list_comments', { thingId: t.id, limit: 200 }, (p) => {
      if (!state.view || state.view.id !== t.id) return;
      const all = (p && p.comments) || [];
      if (!changed('comments', all)) return;
      $('dCommentCount').textContent = p.count ? '— ' + p.count : '';
      const slot = $('dComments');
      if (!all.length) { slot.innerHTML = '<div class="empty">No comments.</div>'; return; }
      slot.innerHTML = '';
      const roots = all.filter((c) => !c.parentId);
      const byParent = new Map();
      for (const c of all) {
        if (c.parentId) {
          if (!byParent.has(c.parentId)) byParent.set(c.parentId, []);
          byParent.get(c.parentId).push(c);
        }
      }
      const renderComment = (c, reply) => {
        const el = document.createElement('div');
        el.className = 'comment' + (reply ? ' reply' : '');
        const ts = parseTs(c.createdAt);
        el.innerHTML = '<div class="meta"><b>' + esc(c.authorName || 'Someone') + '</b>' + (ts ? ' · ' + fmtAgo(ts) : '') + '</div><div>' + mdInline(c.content || '') + '</div>';
        slot.appendChild(el);
        for (const r of byParent.get(c.id) || []) renderComment(r, true);
      };
      for (const c of roots) renderComment(c, false);
    }, 'comments', LIVE_OPTS));
  }

  // ---------------------------------------------------------------- markdown (GFM subset)
  function mdInline(src) {
    let s = esc(src);
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return ' ' + (codes.length - 1) + ' '; });
    s = s.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, (_, alt, url) =>
      '<a class="imgchip" href="' + url + '" target="_blank" rel="noopener">\u{1F5BC}️ ' + (alt || 'image') + '</a>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[\s(])((?:https?:\/\/)[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<i>$2</i>');
    s = s.replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g, '$1<i>$2</i>');
    s = s.replace(/~~([^~]+)~~/g, '<s>$1</s>');
    s = s.replace(/ (\d+) /g, (_, i) => '<code>' + codes[Number(i)] + '</code>');
    return s;
  }

  function mdRender(src) {
    const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let i = 0;
    const listStack = [];   // ['ul'|'ol', indent]
    const closeLists = (indent) => {
      while (listStack.length && (indent === -1 || listStack[listStack.length - 1][1] >= indent)) {
        out.push(listStack.pop()[0] === 'ul' ? '</ul>' : '</ol>');
      }
    };
    let align = null;
    while (i < lines.length) {
      const line = lines[i];

      const fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        closeLists(-1);
        const buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      const alignFence = line.match(/^:::\s*(center|right|left)\s*$/);
      if (alignFence) { closeLists(-1); align = alignFence[1] === 'left' ? null : alignFence[1]; i++; continue; }
      if (/^:::\s*$/.test(line)) { closeLists(-1); align = null; i++; continue; }
      const alignAttr = align ? ' class="align-' + align + '"' : '';

      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeLists(-1); out.push('<h' + h[1].length + alignAttr + '>' + mdInline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }

      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeLists(-1); out.push('<hr>'); i++; continue; }

      if (/^\s*>/.test(line)) {
        closeLists(-1);
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + buf.map(mdInline).join('<br>') + '</blockquote>');
        continue;
      }

      // GFM pipe table: header row + separator row.
      if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
        closeLists(-1);
        const cells = (l) => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => mdInline(c.trim()));
        const head = cells(line);
        i += 2;
        let rows = '';
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
          rows += '<tr>' + cells(lines[i]).map((c) => '<td>' + c + '</td>').join('') + '</tr>';
          i++;
        }
        out.push('<div class="tablewrap"><table><tr>' + head.map((c) => '<th>' + c + '</th>').join('') + '</tr>' + rows + '</table></div>');
        continue;
      }

      const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (li) {
        const indent = li[1].length;
        const type = /^[-*+]$/.test(li[2]) ? 'ul' : 'ol';
        const top = listStack[listStack.length - 1];
        if (!top || indent > top[1]) { out.push(type === 'ul' ? '<ul>' : '<ol>'); listStack.push([type, indent]); }
        else if (indent < top[1]) { closeLists(indent + 1); if (!listStack.length) { out.push(type === 'ul' ? '<ul>' : '<ol>'); listStack.push([type, indent]); } }
        else if (top[0] !== type) { out.push(top[0] === 'ul' ? '</ul>' : '</ol>'); listStack.pop(); out.push(type === 'ul' ? '<ul>' : '<ol>'); listStack.push([type, indent]); }
        const task = li[3].match(/^\[([ xX])\]\s+(.*)$/);
        if (task) {
          out.push('<li class="task"><input type="checkbox" disabled' + (task[1] !== ' ' ? ' checked' : '') + '>' + mdInline(task[2]) + '</li>');
        } else {
          out.push('<li>' + mdInline(li[3]) + '</li>');
        }
        i++;
        continue;
      }

      if (!line.trim()) { closeLists(-1); i++; continue; }

      closeLists(-1);
      const buf = [line];
      i++;
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|:::|\s*>|\s*([-*+]|\d+[.)])\s|(-{3,}|\*{3,}|_{3,})\s*$)/.test(lines[i]) && !/\|/.test(lines[i])) {
        buf.push(lines[i]);
        i++;
      }
      out.push('<p' + alignAttr + '>' + buf.map(mdInline).join('<br>') + '</p>');
    }
    closeLists(-1);
    return out.join('');
  }

  // ---------------------------------------------------------------- workspaces
  function selectWorkspace(id, open) {
    state.currentWs = id;
    store.set('ews.ws', id);
    $('wsSelect').value = id;
    if (open !== false) openGrid();
  }

  function renderWorkspaces() {
    const sel = $('wsSelect');
    sel.innerHTML = '';
    for (const w of state.workspaces) {
      const o = document.createElement('option');
      o.value = w.id;
      o.textContent = w.name;
      sel.appendChild(o);
    }
    if (state.currentWs) sel.value = state.currentWs;
  }

  // Digests a {workspaces, defaultWorkspaceId}-shaped payload — delivered by
  // both the base list_workspaces watch and the grid's bootstrap watch — into
  // the dropdown and the landing decisions.
  function handleWorkspaces(p) {
    state.workspaces = (p && p.workspaces) || [];
    if (!state.workspaces.length) {
      clearScoped();
      state.view = null;
      $('view').innerHTML = '<div class="empty">No workspaces yet — create one in the app.</div>';
      return;
    }
    if (changed('workspaces', state.workspaces)) renderWorkspaces();

    const known = (id) => !!id && state.workspaces.some((w) => w.id === id);
    // The workspace the user set as default in the app. The server reports it
    // only while they still have access, so it needs no further vetting; a
    // server predating the field leaves it null and the old order applies.
    const def = (p && p.defaultWorkspaceId) || null;

    if (!known(state.currentWs)) {
      // A bootstrap grid picks its own landing (the server adopts one), so
      // don't land over its in-flight first call. Where to land otherwise,
      // best first: their default, then whatever they last opened here, then
      // the first workspace in switcher order.
      if (!state.noBoot && state.view && state.view.type === 'grid') return;
      const saved = store.get('ews.ws');
      selectWorkspace(def || (known(saved) ? saved : state.workspaces[0].id));
    } else if (state.autoWs && def && def !== state.currentWs && (!state.view || state.view.type === 'grid')) {
      // A first delivery served from cache can predate the default being
      // known. Adopt it while they are still on the landing grid — never
      // under someone who has picked a workspace or opened a thing.
      selectWorkspace(def);
    }
  }

  // ---------------------------------------------------------------- follow
  // Follow mode: while armed, the panel follows activity — a thing created or
  // updated after arming (typically an agent writing through MCP) opens
  // automatically, switching workspace when needed; an update to the thing
  // already open refreshes its text in place. Pull-only: it rides a
  // recent_things watch at the contract's ~30 s polling floor, so a jump
  // lands within half a minute of the write and a burst lands on the newest.
  // The first delivery after arming only sets the baseline — server
  // timestamps compare against server timestamps, never the local clock.
  function userNav() {
    if (!state.follow) return;
    setFollow(false);
    toast('Follow paused');
  }

  function setFollow(on) {
    state.follow = on;
    state.followSeen = null;
    const btn = $('followBtn');
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
    for (const un of subs.follow) { try { un(); } catch { /* idempotent */ } }
    subs.follow = [];
    renderKeys.delete('follow');
    if (!on) return;
    // Uncached (gcTime 0): a replay from an earlier arming would make the
    // baseline stale and the first "jump" an old edit.
    subs.follow.push(watch('recent_things', { limit: 3 }, (p) => {
      if (!state.follow) return;
      const items = ((p && p.things) || [])
        .map((t) => ({ t, ts: parseTs(t.updatedAt) }))
        .filter((x) => x.ts !== null)
        .sort((a, b) => b.ts - a.ts);
      if (state.followSeen === null) { state.followSeen = items.length ? items[0].ts : 0; return; }
      const next = items.find((x) => x.ts > state.followSeen);
      if (!next) return;
      state.followSeen = next.ts;
      const open = state.view && state.view.type === 'thing' ? state.view.id : null;
      // An agent still filling in the open thing: refresh it in place rather
      // than re-opening it. This feed and the thing's own watch poll on
      // independent cycles, so invalidating here delivers the new text on
      // whichever fires first — roughly halving the wait a single poll would
      // impose, without a timer of our own.
      if (next.t.id === open) { invalidateThing(); return; }
      followJump(next.t);
    }, 'follow', { cache: { staleTime: 0, gcTime: 0 }, refetchInterval: POLL_FAST }));
  }

  // Drop the cached thing-scoped reads so the open thing's watches re-execute
  // and deliver now. Only registered watches re-execute, so this costs one
  // flight per visible section and only when the feed reported a real change.
  function invalidateThing() {
    for (const tool of ['get_thing', 'list_child_things', 'list_comments', 'list_marks']) {
      try { Promise.resolve(mcp.invalidate(SERVER, tool)).catch(() => {}); } catch { /* old shell */ }
    }
  }

  async function followJump(t) {
    // t is a recent_things item: {id, name, emoji, parentId, workspaceId, …}
    if (t.workspaceId && t.workspaceId !== state.currentWs) {
      state.currentWs = t.workspaceId;
      store.set('ews.ws', t.workspaceId);
      $('wsSelect').value = t.workspaceId;
    }
    const trail = await ancestorTrail(t.parentId);
    if (!state.follow) return; // switched off while we walked
    openThing({ id: t.id, name: t.name, emoji: t.emoji }, trail);
  }

  // Walk parentId upward via get_thing. Servers from 2026-08-07 return
  // parentId; older ones leave it undefined and the walk just stops — shorter
  // crumbs, never an error.
  async function ancestorTrail(parentId) {
    const chain = [];
    let id = parentId;
    for (let depth = 0; id && depth < 6; depth++) {
      try {
        const res = await mcp.callTool(SERVER, 'get_thing', { thingId: id }, { cache: CACHE });
        const p = res.payload || {};
        chain.push({ id: p.id || id, name: p.name || '…', emoji: p.emoji });
        id = p.parentId || null;
      } catch { break; }
    }
    return chain.reverse();
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    if (!mcp) {
      showBanner('Open this page from claude.ai', 'This panel reads your Everythings data through claude.ai connectors, which are only available when the artifact is opened from claude.ai.', true);
      setStatus('err', 'no connector bridge');
      return;
    }

    $('refreshBtn').addEventListener('click', async () => {
      const btn = $('refreshBtn');
      btn.classList.add('spin');
      try {
        await mcp.invalidate(SERVER);
      } catch {
        // Older shell: nothing cached to drop — force-fetch by re-registering.
        if (state.view && state.view.type === 'thing') {
          const v = state.view;
          openThing({ id: v.id, name: v.name, emoji: v.emoji }, v.trail);
        } else if (state.view) {
          openGrid();
        }
      }
      setTimeout(() => btn.classList.remove('spin'), 900);
    });

    $('wsSelect').addEventListener('change', (e) => {
      userNav();
      state.autoWs = false;
      selectWorkspace(e.target.value);
    });

    $('followBtn').addEventListener('click', () => {
      setFollow(!state.follow);
      toast(state.follow
        ? 'Following activity — things open here as they are created or updated'
        : 'Follow off');
    });

    setStatus('boot', 'connecting…');

    // Speculative first paint: open the grid immediately — its bootstrap
    // watch answers the whole landing view (dropdown + tiles) in one round
    // trip, for the saved workspace when one is remembered, else the server's
    // default. handleWorkspaces corrects the guess if the app default changed.
    state.currentWs = store.get('ews.ws') || null;
    openGrid();

    // Keeps the dropdown fresh (and the landing logic armed) while the viewer
    // sits in thing views, where no bootstrap watch is registered; also the
    // whole landing path when the server lacks the bootstrap tool.
    subs.base.push(watch('list_workspaces', null, handleWorkspaces, 'workspaces', { refetchInterval: 120000 }));
  }

  boot();
})();
</script>
<style>
  /* ------------------------------------------------------------------ font.
     Montserrat variable (latin subset), inlined — the artifact CSP blocks
     font CDNs. One file covers weights 100-900. Declared at the end of the
     document so the boot script above parses first and its opening connector
     calls are not stuck behind this ~50KB blob; font-display: swap covers
     the wait. */
  @font-face {
    font-family: 'Montserrat';
    font-style: normal;
